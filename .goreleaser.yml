version: 2

# a template: the generated project replaces the names below
project_name: tool

archives:
  - id: tool
    ids:
      - tool
    files:
      - LICENSE
    formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}-{{.Arch}}"

# brews is deprecated upstream, but it is the only GoReleaser generator of a
# Formula (as octopot/indexit and octomation/maintainer). Keep GoReleaser
# pinned in CI.
brews:
  - name: tool
    ids: [tool]
    # a prerelease tag (vX.Y.Z-rcN) leaves the tap as it is
    skip_upload: auto
    commit_author:
      use_github_app_token: true
    description: "Template for a typical CLI-tool written on Go."
    directory: Formula
    homepage: https://go-tool.octolab.org/
    repository:
      owner: octolab
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    install: |
      bin.install "tool"
      generate_completions_from_executable(bin/"tool", "completion")
      prefix.install_metafiles
    test: |
      system "#{bin}/tool", "version"

builds:
  - id: tool
    binary: tool
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    main: .

checksum: { name_template: checksums.txt }

release:
  # the repository comes from the git remote; a prerelease tag (vX.Y.Z-rcN)
  # is published as a prerelease, never as Latest
  prerelease: auto
